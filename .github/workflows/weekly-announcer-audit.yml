name: Weekly NFL Announcer Audit

on:
  schedule:
    # Run every Thursday and Friday at 15:00 UTC (11:00 AM ET) ahead of the weekend games
    - cron: '0 15 * * 4,5'
  workflow_dispatch:
  push:
    paths:
      - 'src/data/announcerRegistry.ts'
      - 'scripts/audit-announcers.mjs'

permissions:
  contents: write

jobs:
  audit-announcers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-audit - scrape announcer pairings
        run: npm run update:announcers -- --weeks 2

      - name: Commit and push registry updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/announcerRegistry.ts; then
            echo "No registry changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/announcerRegistry.ts
          git commit -m "chore: auto-update NFL announcer registry [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}

      - name: Run Announcer Audit against live NFL schedule
        run: npm run audit:announcers -- --within-hours 72 --weeks 2
