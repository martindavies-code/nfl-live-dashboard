name: Weekly NFL Announcer Audit

on:
  schedule:
    # Run Mon-Sat at 06:00 UTC (01:00 ET) and a second pass 6 hours later at 12:00 UTC (07:00 ET).
    # Two daily passes ensure even a 6-8 hour GitHub Actions cron delay runs ahead of Wed/Thu/Fri/Sat
    # holiday kickoffs and captures same-day network announcements.
    - cron: '0 6 * * 1-6'
    - cron: '0 12 * * 1-6'
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Number of upcoming NFL weeks to check (defaults to 2)'
        required: false
        default: '2'
        type: string
      url:
        description: 'Optional article URL(s) to ingest (space or comma separated)'
        required: false
        default: ''
        type: string
      confirm_single_source:
        description: 'Allow single-source manual confirmation when supplying a manual URL'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'src/data/announcerRegistry.ts'
      - 'scripts/audit-announcers.mjs'
      - 'scripts/update-announcers.mjs'
      - 'scripts/announcer-sources.json'

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  audit-announcers:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-audit - scrape announcer pairings
        env:
          INPUT_WEEKS: ${{ github.event.inputs.weeks || '2' }}
          INPUT_URL: ${{ github.event.inputs.url || '' }}
          INPUT_CONFIRM: ${{ github.event.inputs.confirm_single_source || 'false' }}
        run: |
          ARGS=(--weeks "$INPUT_WEEKS" --report-file /tmp/announcer-update-report.json)
          if [ -n "$INPUT_URL" ]; then
            for u in ${INPUT_URL//,/ }; do
              [ -n "$u" ] && ARGS+=(--url "$u")
            done
          fi
          if [ "$INPUT_CONFIRM" = "true" ]; then
            ARGS+=(--confirm-single-source)
          fi
          npm run update:announcers -- "${ARGS[@]}"

      - name: Commit and push registry updates
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/announcerRegistry.ts; then
            echo "No registry changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/announcerRegistry.ts
          git commit -m "chore: auto-update NFL announcer registry"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger GitHub Pages deployment for updated registry
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref ${{ github.ref_name }}

      - name: Run Announcer Audit against live NFL schedule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_WEEKS: ${{ github.event.inputs.weeks || '2' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          node --experimental-strip-types scripts/audit-announcers.mjs \
            --within-hours 72 \
            --weeks "${INPUT_WEEKS:-2}" \
            --update-report /tmp/announcer-update-report.json \
            --report-file /tmp/announcer-audit-report.json
          AUDIT_EXIT=$?
          set -e

          ISSUE_TITLE="Announcer crews missing"
          OPEN_NUM=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)

          if [ "$AUDIT_EXIT" -eq 0 ]; then
            if [ -n "$OPEN_NUM" ]; then
              gh issue close "$OPEN_NUM" --comment "✅ Announcer audit passed: every game kicking off within 72 hours now has a verified crew in \`src/data/announcerRegistry.ts\`."
            fi
            exit 0
          fi

          export AUDIT_EXIT
          node -e '
            const fs = require("node:fs");
            const audit = fs.existsSync("/tmp/announcer-audit-report.json")
              ? JSON.parse(fs.readFileSync("/tmp/announcer-audit-report.json", "utf8"))
              : { missingSoon: [], errors: ["Audit exited with code " + process.env.AUDIT_EXIT] };
            const lines = [
              "Automated announcer audit failed (`exit " + process.env.AUDIT_EXIT + "`).",
              "",
              "Workflow run: " + process.env.RUN_URL,
              "",
            ];
            if (audit.missingSoon && audit.missingSoon.length) {
              lines.push("### Games within 72h missing verified crews");
              for (const m of audit.missingSoon) {
                const why = m.detail ? `${m.reason} — ${m.detail}` : m.reason;
                lines.push(`- **W${m.week} ${m.away} @ ${m.home}** (${m.kickoff}, ${m.networks || "network TBD"}): ${why}`);
              }
              lines.push("");
            }
            if (audit.errors && audit.errors.length) {
              lines.push("### Audit errors");
              for (const e of audit.errors) lines.push(`- ${e}`);
              lines.push("");
            }
            lines.push("See README.md for manual fallback instructions (`scripts/announcer-sources.json`, `workflow_dispatch` `url` input, or updating `src/data/announcerRegistry.ts`).");
            fs.writeFileSync("/tmp/announcer-issue-body.md", lines.join("\n"));
          '

          if [ -n "$OPEN_NUM" ]; then
            gh issue edit "$OPEN_NUM" --body-file /tmp/announcer-issue-body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file /tmp/announcer-issue-body.md
          fi

          exit "$AUDIT_EXIT"
