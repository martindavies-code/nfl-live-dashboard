name: Weekly NFL Highlights Update

on:
  schedule:
    # Daily at 13:00 UTC (08:00 ET) to pick up official highlights published after last night's games
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-highlights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest verified official NFL highlights
        run: node scripts/update-highlights.mjs

      - name: Commit and push registry updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/highlightsRegistry.ts; then
            echo "No highlights changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/highlightsRegistry.ts
          # No [skip ci]: this push must trigger the Deploy to GitHub Pages workflow
          # so verified highlight links reach the live site.
          git commit -m "chore: auto-update NFL highlights registry"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
